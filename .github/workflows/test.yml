name: 'Run tests 🧪'

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: 'Test types'
        shell: bash
        #language=sh
        run: |
          pnpm test:types

      - name: 'Run tests'
        shell: bash
        #language=sh
        run: |
          pnpm test:run --coverage

      - name: 'Upload coverage'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
